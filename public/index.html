<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eduwalls AutoGTM</title>
<style>
  :root {
    --bg: #0B1C2C; --card: #132234; --card2: #1A2E44; --accent: #2ECC8F;
    --sec: #8BA3B5; --text: #EEF3F7; --muted: #4E6678; --err: #E05252; --warn: #F5A623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif; font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--card2); background: var(--card);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
  h1 span { color: var(--accent); }
  .pill {
    padding: 4px 10px; border-radius: 999px; background: var(--card2);
    color: var(--sec); font-size: 12px; white-space: nowrap;
  }
  .pill.live { background: rgba(46,204,143,.15); color: var(--accent); }
  .pill.dry { background: rgba(245,166,35,.15); color: var(--warn); }
  button {
    background: var(--accent); color: #06121C; border: 0; border-radius: 6px;
    padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button.ghost { background: var(--card2); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 16px; padding: 16px 24px; align-items: start; }
  @media (max-width: 880px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--sec); margin: 0 0 12px; }
  input, textarea, select {
    width: 100%; background: var(--card2); border: 1px solid transparent; border-radius: 6px;
    color: var(--text); padding: 9px 10px; font-family: inherit; font-size: 13px; margin-bottom: 8px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  label { display: block; font-size: 11px; color: var(--sec); margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--sec); text-transform: uppercase; padding: 6px 8px; font-weight: 500; }
  td { padding: 8px; border-top: 1px solid var(--card2); vertical-align: middle; }
  tr.row:hover { background: var(--card2); cursor: pointer; }
  .status { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--card2); color: var(--sec); }
  .status.contacted, .status.followup_1, .status.followup_2 { color: var(--accent); }
  .status.replied, .status.meeting_booked, .status.signed { background: rgba(46,204,143,.18); color: var(--accent); }
  .status.disqualified, .status.declined, .status.error { color: var(--err); }
  .score { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat { background: var(--card2); border-radius: 8px; padding: 10px 14px; min-width: 88px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 11px; color: var(--sec); }
  .email { background: var(--card2); border-radius: 8px; padding: 14px; margin-top: 10px; }
  .email .subj { color: var(--accent); font-weight: 600; margin-bottom: 8px; }
  .email pre { font-family: Georgia, serif; font-size: 13px; line-height: 1.85; white-space: pre-wrap; margin: 0; color: var(--text); }
  .muted { color: var(--muted); font-size: 12px; }
  .err { color: var(--err); font-size: 12px; }
  .log { max-height: 260px; overflow: auto; font-size: 12px; color: var(--sec); }
  .log div { padding: 4px 0; border-top: 1px solid var(--card2); }
  #detail { display: none; }
</style>
</head>
<body>
<header>
  <h1>Eduwalls <span>AutoGTM</span></h1>
  <span class="pill" id="transport">loading</span>
  <span class="pill" id="engine">engine</span>
  <span class="pill" id="quota">sent</span>
  <div style="flex:1"></div>
  <button class="ghost" id="btn-discover">Find schools</button>
  <button id="btn-tick">Run cycle now</button>
</header>

<main>
  <div>
    <div class="card">
      <h2>Add a school</h2>
      <label>School name</label>
      <input id="f-name" placeholder="Greensprings School" />
      <label>Area</label>
      <input id="f-area" placeholder="Lekki" />
      <label>Contact email (optional)</label>
      <input id="f-email" placeholder="info@school.com" />
      <label>Notes (optional)</label>
      <textarea id="f-notes" rows="2" placeholder="Met the proprietor at the NAPPS meeting"></textarea>
      <button id="btn-add">Add to pipeline</button>
    </div>
    <div class="card">
      <h2>Pipeline</h2>
      <div class="stats" id="stats"></div>
    </div>
    <div class="card">
      <h2>Activity</h2>
      <div class="log" id="log"></div>
    </div>
  </div>

  <div>
    <div class="card" id="detail"></div>
    <div class="card">
      <h2>Schools</h2>
      <table>
        <thead><tr><th>School</th><th>Area</th><th>Score</th><th>Status</th><th>Next</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, opts) {
  const res = await fetch(path, {
    method: opts ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json' },
    ...(opts || {}),
  });
  if (!res.ok) throw new Error((await res.text()).slice(0, 200));
  return res.json();
}

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}

async function refresh() {
  const [status, schools, events] = await Promise.all([
    api('/api/status'), api('/api/schools?limit=200'), api('/api/events?limit=60'),
  ]);

  const t = $('transport');
  t.textContent = status.sending.live ? `live via ${status.sending.transport}` : 'dry run, nothing is sent';
  t.className = 'pill ' + (status.sending.live ? 'live' : 'dry');
  $('engine').textContent = status.engine.running ? `engine on, every ${Math.round(status.engine.tickSeconds / 60)} min` : 'engine off';
  $('quota').textContent = `${status.sending.sentToday}/${status.sending.dailyCap} sent today`;

  const order = ['discovered', 'researched', 'sequenced', 'contacted', 'followup_1', 'replied', 'meeting_booked', 'disqualified'];
  $('stats').innerHTML = order
    .filter((k) => status.pipeline[k])
    .map((k) => `<div class="stat"><b>${status.pipeline[k]}</b><span>${k.replace('_', ' ')}</span></div>`)
    .join('') || '<span class="muted">Nothing in the pipeline yet.</span>';

  $('rows').innerHTML = schools.map((s) => `
    <tr class="row" data-id="${s.id}">
      <td>${escapeHtml(s.name)}${s.last_error ? `<div class="err">${escapeHtml(s.last_error)}</div>` : ''}</td>
      <td class="muted">${escapeHtml(s.area || '')}</td>
      <td class="score">${s.score ?? ''}</td>
      <td><span class="status ${s.status}">${s.status.replace('_', ' ')}</span></td>
      <td class="muted">${fmtDate(s.next_action_at)}</td>
    </tr>`).join('');

  for (const tr of document.querySelectorAll('tr.row')) {
    tr.onclick = () => openSchool(tr.dataset.id);
  }

  $('log').innerHTML = events.map((e) =>
    `<div>${new Date(e.created_at + 'Z').toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}
     <b>${escapeHtml(e.kind)}</b> ${escapeHtml(e.school_name || '')}</div>`).join('');
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function openSchool(id) {
  const { school, emails } = await api('/api/schools/' + id);
  const brief = school.research_json ? JSON.parse(school.research_json) : null;
  const el = $('detail');
  el.style.display = 'block';
  el.innerHTML = `
    <h2>${escapeHtml(school.name)} <span class="status ${school.status}">${school.status.replace('_', ' ')}</span></h2>
    ${brief ? `
      <p class="muted">${escapeHtml(brief.inferred_profile || '')}</p>
      <p><b>Angle:</b> ${escapeHtml(brief.recommended_angle || '')}</p>
      <p><b>Watch out:</b> ${escapeHtml(brief.watch_out || '')}</p>
      ${brief.qualification ? `<p><b>Fit ${brief.qualification.score}/100:</b> ${escapeHtml(brief.qualification.reasoning)}</p>` : ''}
      ${(brief.sources || []).length ? `<p class="muted">Sources: ${brief.sources.slice(0, 4).map((u) => `<a href="${escapeHtml(u)}" style="color:var(--sec)" target="_blank" rel="noopener">link</a>`).join(' ')}</p>` : ''}
    ` : '<p class="muted">Not researched yet.</p>'}
    <label>Contact email</label>
    <input id="d-email" value="${escapeHtml(school.contact_email || '')}" placeholder="Needed before anything sends" />
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost" id="d-save">Save email</button>
      <button class="ghost" id="d-prepare">Research and draft</button>
      <button id="d-send">Send next email</button>
    </div>
    ${emails.map((e) => `
      <div class="email">
        <div class="subj">Email ${e.step} &middot; ${escapeHtml(e.subject)} <span class="status ${e.status}">${e.status}</span></div>
        <pre>${escapeHtml(e.body)}</pre>
      </div>`).join('')}
  `;
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });

  $('d-save').onclick = () => run($('d-save'), async () => {
    await api('/api/schools/' + id, { method: 'PATCH', body: JSON.stringify({ contact_email: $('d-email').value.trim() }) });
    await openSchool(id);
  });
  $('d-prepare').onclick = () => run($('d-prepare'), async () => { await api('/api/schools/' + id + '/prepare', { body: '{}' }); await openSchool(id); });
  $('d-send').onclick = () => run($('d-send'), async () => { await api('/api/schools/' + id + '/send-next', { body: '{}' }); await openSchool(id); });
}

async function run(btn, fn) {
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Working...';
  try { await fn(); await refresh(); }
  catch (err) { alert(err.message); }
  finally { btn.disabled = false; btn.textContent = label; }
}

$('btn-add').onclick = () => run($('btn-add'), async () => {
  const name = $('f-name').value.trim();
  if (!name) return;
  await api('/api/schools', { body: JSON.stringify({
    name, area: $('f-area').value.trim() || null,
    contact_email: $('f-email').value.trim() || null,
    notes: $('f-notes').value.trim() || null,
  }) });
  for (const f of ['f-name', 'f-area', 'f-email', 'f-notes']) $(f).value = '';
});
$('btn-tick').onclick = () => run($('btn-tick'), () => api('/api/engine/tick', { body: '{}' }));
$('btn-discover').onclick = () => run($('btn-discover'), () => api('/api/discover', { body: JSON.stringify({ limit: 10 }) }));

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
